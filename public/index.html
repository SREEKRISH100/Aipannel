<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot Token Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-logo">
        <div class="logo-icon">⚡</div>
        <h1>Token Control Panel</h1>
      </div>
      <div class="header-actions">
        <button id="newProjectBtn" class="btn btn-primary">
          <span class="btn-icon">➕</span> New Project
        </button>
        <button id="refreshBtn" class="btn btn-secondary">
          <span class="btn-icon">🔄</span> Refresh Stats
        </button>
      </div>
    </header>

    <main class="app-main">
      <!-- Projects Grid -->
      <section class="section">
        <h2 class="section-title">Active Projects</h2>
        <div id="projectsGrid" class="projects-grid">
          <div class="loading-spinner">Loading projects...</div>
        </div>
      </section>

      <!-- Manage & Config Panel -->
      <div class="layout-columns">
        <section class="section column-left">
          <h2 class="section-title">Configure Limits</h2>
          <div class="card form-card">
            <form id="configForm">
              <div class="form-group">
                <label for="projectSelector">Select Project</label>
                <select id="projectSelector" required>
                  <option value="" disabled selected>Choose a project...</option>
                </select>
              </div>
              <div class="form-group">
                <label for="tokenLimitInput">Token Limit</label>
                <input type="number" id="tokenLimitInput" placeholder="e.g. 1000000" required>
              </div>
              <div class="form-group-checkbox">
                <input type="checkbox" id="projectActiveInput" checked>
                <label for="projectActiveInput">Project Active & Enabled</label>
              </div>
              <button type="submit" class="btn btn-primary">Update Configuration</button>
            </form>
          </div>
        </section>

        <!-- Audit Logs -->
        <section class="section column-right">
          <div class="section-header-row">
            <h2 class="section-title">Completions Audit Logs</h2>
            <select id="logFilter" class="filter-select">
              <option value="all">All Projects</option>
            </select>
          </div>
          <div class="card table-card">
            <div class="table-wrapper">
              <table class="audit-table">
                <thead>
                  <tr>
                    <th>Project</th>
                    <th>Tokens</th>
                    <th>Model</th>
                    <th>Time</th>
                  </tr>
                </thead>
                <tbody id="logsBody">
                  <tr>
                    <td colspan="4" class="no-logs">Loading logs...</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="table-footer">
              <span id="pageInfo">Showing 0-0 of 0 logs</span>
              <div class="pagination-actions">
                <button type="button" id="prevPageBtn" class="btn btn-secondary btn-sm">Prev</button>
                <button type="button" id="nextPageBtn" class="btn btn-secondary btn-sm">Next</button>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- Create Project Modal -->
    <div id="projectModal" class="modal-overlay" style="display: none;">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Create New Project</h3>
          <button type="button" id="closeModalBtn" class="modal-close">&times;</button>
        </div>
        <form id="createProjectForm">
          <div class="form-group">
            <label for="modalProjectId">Project Identifier (Slug)</label>
            <input type="text" id="modalProjectId" placeholder="e.g. support-bot, my-nextjs-app" required pattern="^[a-zA-Z0-9_-]+$" title="Only letters, numbers, hyphens, and underscores allowed">
            <small style="color: var(--text-secondary); font-size: 0.75rem; display:block; margin-top:0.25rem;">Used in API routes and authorization headers</small>
          </div>
          <div class="form-group">
            <label for="modalProjectName">Project Display Name</label>
            <input type="text" id="modalProjectName" placeholder="e.g. Customer Support AI Bot" required>
          </div>
          <div class="form-group">
            <label for="modalTokenLimit">Token Limit</label>
            <input type="number" id="modalTokenLimit" placeholder="500000" value="500000" min="1000" required>
          </div>
          <div class="form-group-checkbox">
            <input type="checkbox" id="modalProjectActive" checked>
            <label for="modalProjectActive">Project Active & Enabled</label>
          </div>
          <div class="modal-actions">
            <button type="button" id="cancelModalBtn" class="btn btn-secondary">Cancel</button>
            <button type="submit" class="btn btn-primary">Create Project</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>

</html>
